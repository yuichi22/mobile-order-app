<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/akuto%20icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="512x512" href="/akuto%20icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Akuto Order System</title>
    <style>
      /* JS/バンドルの読み込み中に即表示する起動ローダー。
         React が #root に描画した時点で中身ごと置き換わり自動的に消える。
         これにより初回コールドロード時の「真っ白」を回避する。 */
      #app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      #app-boot-loader .app-boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #e5e7eb;
        border-top-color: #9ca3af;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-loader"><div class="app-boot-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
